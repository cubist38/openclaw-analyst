# SPDX-License-Identifier: MIT
# Brewlytics policy additions — extend NemoClaw's base openclaw-sandbox policy.
#
# What this adds on top of the upstream policy:
#
#   1. openrouter     — POST to openrouter.ai for model calls (only if you
#                       chose the `openrouter` inference profile instead of
#                       the NVIDIA default; drop if you use Nemotron).
#
#   2. telegram_python — add python3 + brew_chart.py to the telegram_bot
#                        preset's allowed binaries so chart delivery works.
#                        (Upstream telegram preset only allows `node`.)
#
# Drop into `nemoclaw/policy-additions.yaml` and reference from blueprint.yaml.
# See github.com/NVIDIA/NemoClaw/blob/main/agents/hermes/policy-additions.yaml
# for the canonical policy-additions shape.

network_policies:
  # ── Inference via OpenRouter (enable with the `openrouter` profile) ──
  # Drop this block if you stick with NVIDIA Nemotron (the default profile).
  openrouter:
    name: openrouter
    endpoints:
      - host: openrouter.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/api/v1/chat/completions" }
          - allow: { method: POST, path: "/api/v1/completions" }
          - allow: { method: GET,  path: "/api/v1/models" }
          - allow: { method: GET,  path: "/api/v1/models/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  # ── Inference via NIM microservice (enable with the `nim-local` profile) ──
  # Replace nim-service.local with your NIM hostname (must resolve from inside
  # the sandbox — e.g. a LAN DNS name or /etc/hosts entry provided by OpenShell).
  # Use plain-text http: if your NIM is unauthenticated on-prem, https: otherwise.
  nim_service:
    name: nim_service
    endpoints:
      - host: nim-service.local
        port: 8000
        access: full              # NIM is a private OpenAI-compat endpoint; full L4 suffices
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  # ── Inference via self-hosted vLLM (enable with the `vllm` profile) ──
  # vLLM's OpenAI-compatible server at /v1/chat/completions and /v1/completions.
  # Replace vllm.local / port 8000 with your actual vLLM host and port.
  # The sandbox is netns-isolated, so `localhost` only works if vLLM runs
  # inside the sandbox (unusual) — typically you'll point at a separate host.
  vllm:
    name: vllm
    endpoints:
      - host: vllm.local
        port: 8000
        protocol: rest
        enforcement: enforce
        tls: skip                 # on-prem vLLM is usually plaintext; flip to terminate if you front it with TLS
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/v1/completions" }
          - allow: { method: GET,  path: "/v1/models" }
          - allow: { method: GET,  path: "/v1/models/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  # ── Extend telegram access to python (for brew_chart.send / send_photo.py) ──
  # The upstream `telegram` network policy in the base sandbox allows only
  # /usr/local/bin/node. Our specialists generate charts with python3 and
  # call the Telegram Bot API directly from send_photo.py, so we add the
  # interpreter binaries here. Endpoints are identical to the base telegram
  # policy — only the binary allowlist expands.
  telegram_python:
    name: telegram_python
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET,  path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET,  path: "/file/bot*/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.* }
      - { path: /usr/local/bin/python3 }
      - { path: /sandbox/.openclaw-data/workspaces/*/data/python3 }
