# SPDX-License-Identifier: MIT
# Brewlytics NemoClaw blueprint — deploys the 4-agent analyst stack
# inside a NemoClaw/OpenShell sandbox.
#
# This mirrors the shape of NVIDIA's upstream blueprint
# (github.com/NVIDIA/NemoClaw/blob/main/nemoclaw-blueprint/blueprint.yaml),
# but swaps in a derivative sandbox image that bakes Brewlytics config
# and the Starbucks DB generator on top of the upstream OpenClaw sandbox.
#
# UNTESTED — NemoClaw is alpha. Validate against the current NemoClaw
# blueprint schema before trusting this file.

version: "0.1.0"
min_openshell_version: "0.0.24"
min_openclaw_version: "2026.4.2"

# Pin your derivative image by digest for supply-chain protection.
# After building (see nemoclaw/Dockerfile.sandbox), record the digest
# with `docker inspect --format='{{index .RepoDigests 0}}' <tag>` and
# paste it here.
digest: "sha256:REPLACE_WITH_YOUR_IMAGE_DIGEST"

profiles:
  - default        # NVIDIA-hosted Nemotron
  - openrouter     # OpenRouter (matches vanilla-Docker deployment)
  - nim-local      # NVIDIA NIM microservice on a reachable host
  - vllm           # self-hosted vLLM (OpenAI-compatible)

description: |
  Brewlytics — a 4-agent OpenClaw analyst stack (concierge + analyst +
  data-scientist + customer-intel) running inside a NemoClaw sandbox.

components:
  sandbox:
    # Replace with your locally built image after running:
    #   docker build -f nemoclaw/Dockerfile.sandbox -t brewlytics-sandbox:latest .
    # Then pin by digest, not :latest.
    image: "brewlytics-sandbox@sha256:REPLACE_WITH_YOUR_IMAGE_DIGEST"
    name: "openclaw"
    forward_ports:
      - 18789

  inference:
    profiles:
      # Default: NVIDIA-hosted Nemotron (aligned with NemoClaw's happy path).
      # Requires NVIDIA_API_KEY in the onboard environment or credential store.
      default:
        provider_type: "nvidia"
        provider_name: "nvidia-inference"
        endpoint: "https://integrate.api.nvidia.com/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NVIDIA_API_KEY"

      # Alternative: keep OpenRouter (matches the vanilla-Docker deployment).
      # Requires OPENROUTER_API_KEY AND the `openrouter` entry in policy-additions.yaml.
      openrouter:
        provider_type: "openai"
        provider_name: "openrouter"
        endpoint: "https://openrouter.ai/api/v1"
        model: "x-ai/grok-3-fast"
        credential_env: "OPENROUTER_API_KEY"
        timeout_secs: 180

      # Alternative: NVIDIA NIM microservice on a reachable host (on-prem GPU,
      # or NIM inside a sibling container). Requires NIM_API_KEY if the NIM
      # instance has auth enabled; `dummy` works for unauthenticated local NIM.
      # Requires the `nim_service` entry in policy-additions.yaml.
      nim-local:
        provider_type: "openai"
        provider_name: "nim-local"
        endpoint: "http://nim-service.local:8000/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NIM_API_KEY"
        credential_default: "dummy"
        timeout_secs: 180

      # Alternative: self-hosted vLLM (OpenAI-compatible). vLLM is expected to
      # be reachable from inside the sandbox — the sandbox is network-namespaced,
      # so `localhost:8000` only works if vLLM runs inside the sandbox (rare).
      # For the common case (vLLM on a separate host), replace the endpoint
      # with your resolvable hostname (e.g. http://vllm.local:8000/v1) and
      # add a matching `vllm` entry in policy-additions.yaml.
      # Requires the `vllm` entry in policy-additions.yaml.
      vllm:
        provider_type: "openai"
        provider_name: "vllm-local"
        endpoint: "http://vllm.local:8000/v1"
        model: "nvidia/nemotron-3-nano-30b-a3b"
        credential_env: "VLLM_API_KEY"
        credential_default: "dummy"
        timeout_secs: 180

  policy:
    # Base policy is NemoClaw's default OpenClaw sandbox policy
    # (read-only /sandbox, writable /sandbox/.openclaw-data, etc.).
    base: "sandboxes/openclaw/policy.yaml"
    # Additions extend the base — declared in policy-additions.yaml next to this file.
    additions_file: "nemoclaw/policy-additions.yaml"
